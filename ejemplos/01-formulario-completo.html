<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario completo (form, input, radio, submit, reset)</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<main>
<a class="volver" href="../index.html">&larr; Volver al índice</a>
<h1>Ejemplo 1: Formulario completo (form, input, radio, submit, reset)</h1>
<form action="ejemplo.php" method="get">
  <p>Nombre: <input type="text" name="nombre" size="30"></p>
  <p>Año de nacimiento: <input type="number" name="nacido" min="1900"></p>
  <p>Sexo:
    <input type="radio" name="hm" value="h"> Hombre
    <input type="radio" name="hm" value="m"> Mujer
  </p>
  <p>
    <input type="submit" value="Enviar">
    <input type="reset" value="Borrar">
  </p>
</form>
</main>
</body>
</html>
